# detur — self-hosted Detour-compatible deferred deep-link server.
# One-command deploy:  docker compose up -d --build
#
# Topology (KTD5):
#   8080  SDK + click pipeline + well-known — public. Production MUST put a
#         TLS reverse proxy in front (see commented `caddy` service and
#         docs/guide.md). Bearer apiKey + fingerprints never over plain http.
#   8081  portal (API + UI) — published on host loopback ONLY. Portal has no
#         auth (R19): exposure = API-key exfiltration + redirect retargeting.
#         Reach it via Tailscale/Cloudflare Access, never publicly.

services:
  detur:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"               # SDK + pipeline, public
      - "127.0.0.1:8081:8081"     # portal, host loopback only (KTD5)
    env_file:
      - .env.example              # edit in place before first up
    volumes:
      - detur-data:/data          # SQLite file persists across restarts/rebuilds
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- TLS termination (production) -----------------------------------------
  # Uncomment + create docker/Caddyfile (see docs/guide.md -> Deploy -> TLS):
  #   links.yourdomain.com { reverse_proxy detur:8080 }
  # Then change detur's 8080 mapping above to 127.0.0.1:8080:8080 so only
  # caddy faces the network. Do NOT reverse-proxy the portal route publicly —
  # keep it loopback + Tailscale/Cloudflare Access (docs/guide.md).
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #   depends_on:
  #     - detur

volumes:
  detur-data: